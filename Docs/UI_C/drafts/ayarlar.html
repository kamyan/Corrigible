<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Taslak · Ayarlar</title>
<link rel="stylesheet" href="../reference/html/fonts.css"><link rel="stylesheet" href="desk_ref.css"><link rel="stylesheet" href="drafts.css"></head>
<body>
<div class="c scene">
<img class="bgimg" src="../captures/F8_oyun_masa.png" alt="">
<div class="scrim soft"></div>

<!-- Ayarlar: dizin kartı penceresi (masanın Rehber/hedef kartı dili); ⚙ düğmesinden ya da giriş dosyasından açılır, zaman durur -->
<div class="icard" style="left:700px;top:250px;width:520px;height:520px">
  <div class="ic-h"><span class="ic-t">AYARLAR</span><span class="ic-s">her oyunda geçerli</span><span class="key" style="margin-left:auto">Esc</span><button class="xb" style="margin-left:6px"><svg class="ico" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
  <div style="padding:14px 22px 0">
    <div class="secth" style="margin-top:4px">SES<span class="ln"></span></div>
    <div class="vrow"><span class="l">Ana ses</span>
      <div class="fader"><span class="tr"></span><span class="fl" style="width:80%"></span><span class="tk" style="left:0"></span><span class="tk" style="left:25%"></span><span class="tk" style="left:50%"></span><span class="tk" style="left:75%"></span><span class="tk" style="left:100%"></span><span class="kn" style="left:80%"></span></div>
      <span class="v">%80</span></div>
    <div class="vrow"><span class="l">Müzik</span>
      <div class="fader"><span class="tr"></span><span class="fl" style="width:60%"></span><span class="tk" style="left:0"></span><span class="tk" style="left:25%"></span><span class="tk" style="left:50%"></span><span class="tk" style="left:75%"></span><span class="tk" style="left:100%"></span><span class="kn" style="left:60%"></span></div>
      <span class="v">%60</span></div>
    <div class="vrow"><span class="l">Ortam</span>
      <div class="fader"><span class="tr"></span><span class="fl" style="width:70%"></span><span class="tk" style="left:0"></span><span class="tk" style="left:25%"></span><span class="tk" style="left:50%"></span><span class="tk" style="left:75%"></span><span class="tk" style="left:100%"></span><span class="kn" style="left:70%"></span></div>
      <span class="v">%70</span></div>
    <div class="vrow"><span class="l">Efektler</span>
      <div class="fader"><span class="tr"></span><span class="fl" style="width:90%"></span><span class="tk" style="left:0"></span><span class="tk" style="left:25%"></span><span class="tk" style="left:50%"></span><span class="tk" style="left:75%"></span><span class="tk" style="left:100%"></span><span class="kn" style="left:90%"></span></div>
      <span class="v">%90</span></div>
    <div class="rule" style="border-bottom:0"><span class="cb">X</span><div><b>Ses açık</b><span>Kapatınca bütün kanallar susar; ayarlar korunur.</span></div></div>
    <div class="secth">DİL<span class="ln"></span></div>
    <div><span class="radio"><i class="on"></i>Türkçe</span><span class="radio"><i></i>English</span></div>
    <div style="margin-top:6px;font-size:12px;color:var(--ink3)">Dil değişince masa yeniden çizilir; oyunda üretilmiş haberler üretildikleri dilde kalır.</div>
  </div>
  <div style="position:absolute;left:22px;right:22px;bottom:18px;display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:var(--ink3)">Zaman ayarlar açıkken durur.</span><button class="bt" style="margin-left:auto">Kapat</button><span class="key">Esc</span></div>
</div>
</div>
</body></html>
