<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Fütüristik · Baskın — sonuç: hedef kırıldı</title>
<link rel="stylesheet" href="../../fonts/web/fonts.css">
<style>
body{margin:0;background:#02050A}
a{color:#5BE4FF}a:hover{color:#B4F5FF}
/* ---------- FX · fütüristik tema ---------- */
.fx{--bg:#02050A;--glass:rgba(8,20,34,.76);--line:rgba(91,228,255,.24);--line2:rgba(91,228,255,.55);--cy:#5BE4FF;--cy2:#B4F5FF;--cy3:#2FA8D8;
--tx:#E4F8FF;--tx2:#9CC4D4;--tx3:#6E8FA0;--am:#FFB547;--am2:#FFD58C;--ai:#3D8BFF;--ice:#B3F1FF;--rd:#FF4D63;--rd2:#FF8A97;--mt:#3DFFB4;--vi:#A98EFF;
position:relative;overflow:hidden;background:var(--bg);font-family:'IBM Plex Sans',sans-serif;font-size:13px;line-height:1.35;color:var(--tx);-webkit-font-smoothing:antialiased}
.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx button{font-family:inherit;color:inherit}
.fx .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.fx .hd{font-family:'Chakra Petch',sans-serif}
.fx .ico{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

@keyframes fx-sweep{0%{transform:translateX(-120%)}100%{transform:translateX(420%)}}
@keyframes fx-scan{0%{transform:translateX(-200px)}100%{transform:translateX(2100px)}}
@keyframes fx-scany{0%{transform:translateY(-140px)}100%{transform:translateY(1200px)}}
@keyframes fx-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes fx-glowp{0%,100%{box-shadow:0 0 0 0 rgba(91,228,255,0)}50%{box-shadow:0 0 14px 2px rgba(91,228,255,.35)}}
@keyframes fx-spin{to{transform:rotate(360deg)}}
@keyframes fx-spinr{to{transform:rotate(-360deg)}}
@keyframes fx-dash{to{stroke-dashoffset:-60}}
@keyframes fx-dashs{to{stroke-dashoffset:-24}}
@keyframes fx-blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes fx-in-down{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes fx-in-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fx-in-left{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes fx-in-right{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes fx-in-fade{from{opacity:0}to{opacity:1}}
@keyframes fx-in-scale{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes fx-flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.35}94%{opacity:1}96%{opacity:.6}97%{opacity:1}}
@keyframes fx-shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@keyframes fx-hazard{to{background-position:28px 0}}
@keyframes fx-ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes fx-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes fx-type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes fx-caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fx-marker{0%{left:0%}11.1%{left:0%}44.4%{left:100%}55.5%{left:100%}88.8%{left:0%}100%{left:0%}}

/* temel panel: cam + iki köşe parantezi + üst kenarda ışık süpürmesi */
.fx-p{position:absolute;background:linear-gradient(180deg,rgba(14,32,52,.82),rgba(5,14,26,.88));border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(180,245,255,.07);backdrop-filter:blur(8px)}
.fx-p::before,.fx-p::after{content:'';position:absolute;width:10px;height:10px;border:2px solid var(--cy);pointer-events:none;filter:drop-shadow(0 0 3px rgba(91,228,255,.8))}
.fx-p::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.fx-p::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.fx-sw{position:absolute;left:0;right:0;top:-1px;height:1px;overflow:hidden;pointer-events:none}
.fx-sw i{position:absolute;left:0;top:0;width:28%;height:1px;background:linear-gradient(90deg,transparent,var(--cy2),transparent);animation:fx-sweep 5.2s linear infinite}
.fx-cap{font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em;line-height:1;color:var(--tx2);text-transform:uppercase;white-space:nowrap}

/* harita */
.fx-map{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block;animation:fx-in-fade 1.2s ease-out both}
.fx-ov{position:absolute;left:0;top:0;pointer-events:none}
.fx-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 1100px 700px at 52% 48%,rgba(0,0,0,0) 55%,rgba(0,3,8,.62) 100%)}
.fx-lines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(91,228,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
.fx-scan{position:absolute;top:0;bottom:0;left:0;width:160px;pointer-events:none;background:linear-gradient(90deg,rgba(91,228,255,0),rgba(91,228,255,.028) 75%,rgba(180,245,255,.10) 99%,rgba(91,228,255,0));mix-blend-mode:screen;animation:fx-scan 12s linear infinite}
.fx-scan::after{content:'';position:absolute;right:1px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,rgba(180,245,255,0),rgba(180,245,255,.32) 30%,rgba(180,245,255,.32) 70%,rgba(180,245,255,0))}
.fx-thread{fill:none;stroke-linecap:round}
.fx-thread.b{stroke:#3D8BFF;stroke-opacity:.35;stroke-width:6;filter:blur(3px)}
.fx-thread.l{stroke:#8FD3FF;stroke-width:1.6;stroke-dasharray:10 8;animation:fx-dash 1.6s linear infinite}
.fx-thread.p{stroke:#FFFFFF;stroke-width:2.4;stroke-dasharray:2 58;animation:fx-dash 1.2s linear infinite}
.fx-route{fill:none;stroke:var(--mt);stroke-width:1.6;stroke-dasharray:3 7;stroke-linecap:round;animation:fx-dashs 1.4s linear infinite}
.fx-sel-o{fill:none;stroke:var(--cy);stroke-width:2.4;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(91,228,255,.9));animation:fx-pulse 2.4s ease-in-out infinite}
.fx-sel-f{fill:#5BE4FF;fill-opacity:.07}
.fx-hl-o{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(255,181,71,.8));animation:fx-dash 2.4s linear infinite}

/* bölge düğümü: küre + değer + ad */
.fx-node{position:absolute;width:0;height:0;padding:0;border:0;background:none;cursor:pointer}
.fx-node canvas{position:absolute;pointer-events:none}
.fx-ret{position:absolute;pointer-events:none;overflow:visible;animation:fx-spin 12s linear infinite;filter:drop-shadow(0 0 4px rgba(91,228,255,.8))}
.fx-val{position:absolute;transform:translateX(-50%);display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px 0 8px;background:rgba(3,10,18,.78);border:1px solid rgba(91,228,255,.32);font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;line-height:1;color:var(--tx);white-space:nowrap;box-shadow:0 0 10px rgba(0,0,0,.6);animation:fx-in-up .6s cubic-bezier(.2,.8,.2,1) both}
.fx-val.hot{border-color:rgba(61,139,255,.7);color:#D7ECFF;box-shadow:0 0 12px rgba(61,139,255,.35)}
.fx-val.unk{color:var(--tx3);border-style:dashed}
.fx-rl{position:absolute;transform:translateX(-50%);font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em;line-height:1;color:#CFEFFA;white-space:nowrap;pointer-events:none;text-shadow:0 0 4px #02050A,0 0 8px #02050A,0 0 12px rgba(91,228,255,.35);animation:fx-in-fade .8s ease-out both}
.fx-rl.sel{color:#02050A;background:var(--cy);padding:3px 6px;text-shadow:none;box-shadow:0 0 12px rgba(91,228,255,.6)}
/* güven rozetleri */
.fx-tr{display:inline-flex;align-items:center;justify-content:center;flex:none}
.fx-tr.ok{width:15px;height:15px;border-radius:50%;background:rgba(61,255,180,.16);border:1px solid var(--mt);color:var(--mt)}
.fx-tr.ok svg{width:9px;height:9px}
.fx-tr.rap{height:15px;padding:0 4px;border:1px dashed var(--vi);color:var(--vi);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.fx-tr.sus{width:16px;height:16px;border-radius:50%;border:1.5px dashed var(--am);color:var(--am);font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:700;animation:fx-pulse 1.6s ease-in-out infinite}
.fx-tr.unk{width:16px;height:16px;border-radius:50%;border:1px dashed var(--tx3);color:var(--tx3);font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:700}
.fx-tr.fake{height:15px;padding:0 4px;background:rgba(255,77,99,.16);border:1px solid var(--rd);color:var(--rd2);font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em}
.fx-tr.big{transform:scale(1.4);transform-origin:center}

/* ekip jetonu, rota etiketi, uyarı */
.fx-tok{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;display:flex;align-items:center;justify-content:center;animation:fx-in-scale .6s ease-out both}
.fx-tok::before{content:'';position:absolute;inset:8px;transform:rotate(45deg);background:rgba(3,14,20,.9);border:1.5px solid var(--mt);box-shadow:0 0 10px rgba(61,255,180,.55),inset 0 0 6px rgba(61,255,180,.35)}
.fx-tok::after{content:'';position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(61,255,180,.55);animation:fx-spin 6s linear infinite}
.fx-tok span{position:relative;font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:700;line-height:1;color:var(--mt)}
.fx-tok.hl::after{border:1.5px solid var(--am);box-shadow:0 0 12px rgba(255,181,71,.6);inset:-6px}
.fx-tag{position:absolute;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;background:rgba(3,14,20,.82);border:1px solid rgba(61,255,180,.45);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;line-height:1;color:var(--mt);white-space:nowrap}
.fx-tag .ico{width:12px;height:12px}
.fx-alert{position:absolute;width:30px;height:28px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-family:'Chakra Petch',sans-serif;font-size:15px;font-weight:700;line-height:1;color:#1A1000}
.fx-alert::before{content:'';position:absolute;inset:0;background:var(--am);clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 0 6px rgba(255,181,71,.9))}
.fx-alert b{position:relative}
.fx-alert::after{content:'';position:absolute;left:50%;top:60%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:1.5px solid var(--am);animation:fx-ring 1.8s ease-out infinite}

/* üst köşe etiketleri */
.fx-chip{top:14px;height:66px;display:flex;align-items:center;gap:12px;padding:0 16px 0 12px;animation:fx-in-down .7s cubic-bezier(.2,.8,.2,1) both}
.fx-hex{position:relative;width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--cy)}
.fx-hex svg.h{position:absolute;inset:0;width:40px;height:40px;overflow:visible}
.fx-hex .ico{position:relative;width:18px;height:18px;stroke-width:1.5;filter:drop-shadow(0 0 3px rgba(91,228,255,.7))}
.fx-hex.red{color:var(--rd)}
.fx-hex.red .ico{filter:drop-shadow(0 0 3px rgba(255,77,99,.8))}
.fx-cb{display:flex;flex-direction:column;justify-content:center;gap:6px}
.fx-cl{display:flex;align-items:center;gap:6px;height:15px}
.fx-cv{display:flex;align-items:baseline;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;line-height:1;color:var(--tx);text-shadow:0 0 10px rgba(91,228,255,.35);white-space:nowrap}
.fx-cv small{font-size:13px;margin-left:-4px;color:var(--tx2)}
.fx-cv .ap{color:var(--vi);text-shadow:0 0 10px rgba(169,142,255,.45)}
.fx-cd{display:inline-flex;align-items:center;gap:2px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.fx-cd .ico{width:11px;height:11px;stroke-width:2.2}
.fx-cd.bad{color:var(--rd)}
.fx-cd.good{color:var(--mt)}
.fx-cd small{font-size:11px;font-weight:500;margin-left:1px;color:var(--tx3)}
.fx-led{position:relative;height:7px;background:repeating-linear-gradient(90deg,rgba(91,228,255,.14) 0 4px,transparent 4px 6px)}
.fx-led .f{position:absolute;left:0;top:0;bottom:0;overflow:hidden;background:repeating-linear-gradient(90deg,var(--c,#5BE4FF) 0 4px,transparent 4px 6px);filter:drop-shadow(0 0 3px var(--c,#5BE4FF))}
.fx-led .f::after{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:fx-shimmer 2.8s ease-in-out infinite}
.fx-led .z{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(90deg,rgba(255,77,99,.55) 0 4px,transparent 4px 6px)}
.fx-led .u{position:absolute;top:-2px;bottom:-2px;border:1px dashed var(--vi);background:rgba(169,142,255,.12)}
.fx-led .m{position:absolute;top:-4px;width:2px;height:15px;margin-left:-1px;background:#FFFFFF;box-shadow:0 0 6px #FFFFFF}
.fx-goal{display:flex;flex-direction:column;gap:6px}
.fx-gr{display:flex;align-items:center;gap:8px;height:13px;font-size:12px;line-height:1;white-space:nowrap}
.fx-gr span:first-child{width:62px;color:var(--tx2);font-weight:500}
.fx-gr .fx-led{width:96px}
.fx-gr b{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;width:34px;text-align:right}

/* üst orta: zaman */
.fx-time{top:14px;left:50%;height:66px;display:flex;align-items:center;gap:14px;padding:0 14px;translate:-50% 0;animation:fx-in-down .7s .1s cubic-bezier(.2,.8,.2,1) both}
.fx-day{display:flex;flex-direction:column;align-items:center;gap:4px}
.fx-day b{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;line-height:1;color:var(--am);text-shadow:0 0 10px rgba(255,181,71,.5)}
.fx-clock{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:500;letter-spacing:.06em;line-height:1;color:var(--tx);text-shadow:0 0 12px rgba(91,228,255,.45)}
.fx-clock i{font-style:normal;animation:fx-blink 1s steps(1) infinite}
.fx-vr{width:1px;height:38px;background:linear-gradient(transparent,var(--line2),transparent)}
.fx-spd{display:flex;gap:6px}
.fx-k{appearance:none;width:34px;height:30px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--line);background:rgba(91,228,255,.05);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.fx-k .ico{width:12px;height:12px;stroke-width:2}
.fx-k.on{background:var(--cy);border-color:var(--cy);color:#02050A;box-shadow:0 0 12px rgba(91,228,255,.7)}

/* alt sol: sekmeler */
.fx-dock{position:absolute;left:16px;bottom:12px;display:flex;align-items:flex-end;gap:8px;animation:fx-in-up .7s .2s cubic-bezier(.2,.8,.2,1) both}
.fx-dt{position:relative;appearance:none;display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 14px 0 12px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(14,32,52,.82),rgba(5,14,26,.9));font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--tx2);cursor:pointer;backdrop-filter:blur(8px)}
.fx-dt::before{content:'';position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:var(--a);box-shadow:0 0 8px var(--a);opacity:.75}
.fx-dt .ico{width:17px;height:17px;color:var(--a);filter:drop-shadow(0 0 3px var(--a))}
.fx-dt .key{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border:1px solid rgba(91,228,255,.35);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0;color:var(--tx3)}
.fx-dt.on{height:52px;padding-bottom:8px;color:var(--tx);border-color:var(--a);background:linear-gradient(180deg,rgba(20,44,66,.92),rgba(6,18,30,.94));box-shadow:0 0 18px -4px var(--a)}
.fx-dt.on::before{opacity:1;height:3px}
.fx-dt .bdg{position:absolute;top:-9px;right:-8px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--am);color:#1A1000;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;box-shadow:0 0 10px rgba(255,181,71,.8);animation:fx-pulse 1.4s ease-in-out infinite}
.fx-dt .bdg.dot{min-width:12px;width:12px;height:12px;padding:0;top:-6px;right:-5px;background:var(--rd);box-shadow:0 0 10px rgba(255,77,99,.9)}

/* alt sağ: lejant, son şalter */
.fx-lgb{position:absolute;right:300px;bottom:22px;appearance:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 12px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(14,32,52,.82),rgba(5,14,26,.9));font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--tx2);cursor:pointer;animation:fx-in-up .7s .25s both}
.fx-lgb .ico{width:16px;height:16px;color:var(--cy)}
.fx-lgb.on{color:var(--tx);border-color:var(--cy);box-shadow:0 0 14px -2px rgba(91,228,255,.7)}
.fx-kill{position:absolute;right:16px;bottom:14px;width:268px;height:66px;appearance:none;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;border:1px solid rgba(255,77,99,.7);background:linear-gradient(180deg,rgba(70,8,16,.9),rgba(30,3,8,.94));cursor:pointer;text-align:left;box-shadow:0 0 22px -6px rgba(255,77,99,.9),inset 0 0 18px rgba(255,77,99,.15);animation:fx-in-up .7s .3s both}
.fx-kill::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(-45deg,var(--rd) 0 7px,#1A0306 7px 14px);background-size:28px 5px;animation:fx-hazard 1.2s linear infinite;opacity:.9}
.fx-kill-l{display:flex;flex-direction:column;gap:5px;flex:1}
.fx-kill-t{font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;letter-spacing:.12em;line-height:1;color:#FFD7DC;white-space:nowrap}
.fx-kill-s{font-size:11px;line-height:1;color:var(--rd2);white-space:nowrap}
.fx-kill-b{position:relative;width:44px;height:44px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#B3122A,#5C0612 70%);border:1.5px solid var(--rd);color:#FFE3E7;box-shadow:0 0 14px rgba(255,77,99,.75)}
.fx-kill-b::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px dashed rgba(255,77,99,.75);animation:fx-spin 8s linear infinite}
.fx-kill-b .ico{width:20px;height:20px;stroke-width:2}

/* genel düğme */
.fx-bt{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line2);background:rgba(91,228,255,.08);font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--tx);cursor:pointer;white-space:nowrap}
.fx-bt .ico{width:14px;height:14px;color:var(--cy)}
.fx-bt.pri{background:var(--cy);border-color:var(--cy);color:#02050A;box-shadow:0 0 16px -2px rgba(91,228,255,.8)}
.fx-bt.pri .ico{color:#02050A}
.fx-bt.dng{border-color:var(--rd);color:var(--rd2);background:rgba(255,77,99,.08)}
.fx-bt.dng .ico{color:var(--rd)}
.fx-key{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border:1px solid rgba(91,228,255,.35);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0;color:var(--tx3)}
.fx-bt.pri .fx-key{border-color:rgba(2,5,10,.4);color:#02050A}

@media (prefers-reduced-motion: reduce){.fx *,.fx *::before,.fx *::after{animation:none !important}}

/* ---------- FX · açılır paneller ---------- */
@keyframes fx-dr-in{from{opacity:0;transform:translateY(22px) scaleY(.96)}to{opacity:1;transform:none}}
@keyframes fx-card-in{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes fx-row-in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes fx-glitch{0%,86%,100%{transform:none;clip-path:inset(0 0 0 0)}88%{transform:translate(-2px,1px);clip-path:inset(10% 0 55% 0)}90%{transform:translate(2px,-1px);clip-path:inset(60% 0 8% 0)}92%{transform:none;clip-path:inset(0 0 0 0)}}
@keyframes fx-redact{0%,100%{background-position:0 0}50%{background-position:40px 0}}
@keyframes fx-ringp{0%,100%{box-shadow:0 0 0 0 rgba(255,181,71,.0)}50%{box-shadow:0 0 0 4px rgba(255,181,71,.25)}}
@keyframes fx-flow{to{stroke-dashoffset:-20}}
@keyframes fx-trav{0%{left:0%}100%{left:100%}}

.fx-chip.hov{border-color:var(--cy);box-shadow:0 0 0 1px rgba(91,228,255,.5),0 0 22px -4px rgba(91,228,255,.9)}
.fx-node.hov .fx-hovr{position:absolute;left:0;top:0;translate:-50% -50%;border-radius:50%;border:1.5px solid var(--cy2);box-shadow:0 0 14px rgba(91,228,255,.7),inset 0 0 10px rgba(91,228,255,.35);pointer-events:none;animation:fx-pulse 1.6s ease-in-out infinite}
.fx-node:hover canvas{filter:brightness(1.25)}
.fx-x{appearance:none;width:28px;height:28px;flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--line);background:rgba(91,228,255,.04);color:var(--tx2);cursor:pointer}
.fx-x .ico{width:12px;height:12px;stroke-width:2}
.fx-x:hover{border-color:var(--cy);color:var(--tx)}
.fx-bt:hover{border-color:var(--cy2);box-shadow:0 0 12px -2px rgba(91,228,255,.7)}
.fx-bt .pc{font-weight:600;letter-spacing:0}
.fx-bt.sm{height:26px;padding:0 9px;font-size:11px}
.fx-bt.sm .ico{width:12px;height:12px}
.fx-bt.ln{border-color:transparent;background:none;color:var(--cy);padding:0 4px}
.fx-bt.ln[aria-disabled="true"]{color:var(--tx3);opacity:.6}

/* küçük küre, can noktaları, bölge çipi, damga, hap */
.fx-mo{position:relative;display:inline-block;flex:none;vertical-align:middle}
.fx-mo .o{position:absolute;left:50%;top:50%;width:0;height:0}
.fx-mo canvas{position:absolute;pointer-events:none}
.fx-pp{display:inline-flex;gap:3px}
.fx-pp i{width:9px;height:9px;background:var(--mt);box-shadow:0 0 5px rgba(61,255,180,.7);transform:skewX(-12deg)}
.fx-pp i.o{background:none;border:1px solid rgba(61,255,180,.45);box-shadow:none}
.fx-pp.ai i{background:var(--rd);box-shadow:0 0 5px rgba(255,77,99,.7)}
.fx-pp.ai i.o{background:none;border-color:rgba(255,77,99,.5);box-shadow:none}
.fx-rc{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px 0 6px;border:1px solid rgba(91,228,255,.22);background:rgba(91,228,255,.05);font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--tx2);white-space:nowrap}
.fx-rc i{width:8px;height:8px;border-radius:50%;flex:none}
.fx-rc i.unk{border:1px dashed var(--tx3)}
.fx-rc .ico{width:12px;height:12px;color:var(--tx2)}
.fx-rc.red{border-color:rgba(255,77,99,.45);color:var(--rd2)}
.fx-rc.red .ico{color:var(--rd)}
.fx-stamp{display:inline-flex;align-items:center;height:24px;padding:0 9px;border:1.5px solid currentColor;font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;letter-spacing:.18em;line-height:1;white-space:nowrap}
.fx-stamp.red{color:var(--rd);background:rgba(255,77,99,.1);box-shadow:0 0 14px rgba(255,77,99,.35),inset 0 0 8px rgba(255,77,99,.2);animation:fx-glitch 4s steps(1) infinite}
.fx-stamp.sm{height:20px;padding:0 7px;font-size:11px}
.fx-pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;line-height:1;white-space:nowrap}
.fx-pill svg{width:10px;height:10px}
.fx-pill.ok{color:#02140D;background:var(--mt);box-shadow:0 0 10px rgba(61,255,180,.55)}
.fx-pill.mv{color:var(--cy);border:1px solid var(--cy);background:rgba(91,228,255,.08)}
.fx-tok.st{position:relative;margin:0;flex:none;animation:none}
.fx-big{font-family:'IBM Plex Mono',monospace;font-size:40px;font-weight:600;line-height:1;color:var(--tx);text-shadow:0 0 16px rgba(91,228,255,.4)}
.fx-big .q{font-family:'Chakra Petch',sans-serif;font-size:24px;font-weight:700;color:var(--am);margin-left:3px;vertical-align:top;text-shadow:0 0 10px rgba(255,181,71,.7);animation:fx-pulse 1.6s ease-in-out infinite}
.fx-hex.sm{width:32px;height:32px}
.fx-hex.sm svg.h{width:32px;height:32px}
.fx-hex.sm .ico{width:15px;height:15px}

/* sızma ölçeği (altın → mavi) */
.fx-scl{position:relative;height:52px}
.fx-scl .t{position:absolute;left:0;right:0;top:20px;height:8px;background:linear-gradient(90deg,#FFB547 0%,#FFC86E 22%,#FF8A3D 42%,#7C8CFF 58%,#3D8BFF 76%,#B3F1FF 100%);box-shadow:0 0 10px rgba(91,228,255,.3);opacity:.9}
.fx-scl .z{position:absolute;top:15px;width:1px;height:18px;background:#E4F8FF;opacity:.55}
.fx-scl .b{position:absolute;top:15px;height:18px;border:1px dashed rgba(228,248,255,.7);background:rgba(228,248,255,.08)}
.fx-scl .mk{position:absolute;top:11px;width:3px;height:26px;margin-left:-1.5px;background:#FFFFFF}
.fx-scl .mk.sus{background:var(--am);box-shadow:0 0 8px var(--am)}
.fx-scl .mk.ok{background:var(--mt);box-shadow:0 0 8px var(--mt)}
.fx-scl .mk.rap{background:#FFFFFF;box-shadow:0 0 8px rgba(169,142,255,.9)}
.fx-scl .lb{position:absolute;top:0;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;line-height:1;white-space:nowrap}
.fx-scl .lb.sus{color:var(--am)}
.fx-scl .lb.ok{color:var(--mt)}
.fx-scl .zn{position:absolute;top:38px;text-align:center;font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;line-height:1;color:var(--tx3);white-space:nowrap}

/* bağ çizgisi */
.fx-ld{fill:none;stroke:#B4F5FF;stroke-width:1.4;stroke-dasharray:6 4;animation:fx-flow .9s linear infinite}

/* çekmece */
.fx-dr{display:flex;flex-direction:column;border-color:rgba(91,228,255,.28);background:linear-gradient(180deg,rgba(12,28,46,.94),rgba(4,12,22,.95));transform-origin:50% 100%;animation:fx-dr-in .55s cubic-bezier(.2,.8,.2,1) both}
.fx-dr::before,.fx-dr::after{border-color:var(--a);filter:drop-shadow(0 0 3px var(--a))}
.fx-dr-h{position:relative;display:flex;align-items:center;gap:10px;height:48px;flex:none;padding:0 10px 0 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--a) 14%,transparent),transparent 70%)}
.fx-dr-h::after{content:'';position:absolute;left:0;bottom:-1px;width:120px;height:1px;background:var(--a);box-shadow:0 0 8px var(--a)}
.fx-dr-i{display:inline-flex;color:var(--a);filter:drop-shadow(0 0 4px var(--a))}
.fx-dr-i .ico{width:18px;height:18px}
.fx-dr-t{font-family:'Chakra Petch',sans-serif;font-size:15px;font-weight:700;letter-spacing:.18em;line-height:1;color:var(--tx)}
.fx-dr-s{font-size:12px;color:var(--tx3)}
.fx-dr-h .fx-x{margin-left:auto}
.fx-dr-b{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px}
.fx-dr-b > *,.fx-card-b > *{flex-shrink:0}

/* bölge kartı */
.fx-card{display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(12,28,46,.94),rgba(4,12,22,.95));animation:fx-card-in .55s cubic-bezier(.2,.8,.2,1) both}
.fx-card-h{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(255,159,90,.10),transparent 60%)}
.fx-card-n{display:flex;flex-direction:column;gap:6px;flex:1}
.fx-card-n b{font-family:'Chakra Petch',sans-serif;font-size:22px;font-weight:700;letter-spacing:.1em;line-height:1;color:var(--tx);text-shadow:0 0 12px rgba(91,228,255,.35)}
.fx-card-n span{font-size:12px;color:var(--tx3)}
.fx-card-h .fx-x{align-self:flex-start}
.fx-card-b{display:flex;flex-direction:column;gap:12px;padding:12px 16px 14px}
.fx-card-st{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px dashed rgba(255,181,71,.55);background:rgba(255,181,71,.07);font-size:13px;font-weight:600;color:var(--am2)}
.fx-card-st .r{margin-left:auto;font-size:12px;font-weight:500;color:var(--am)}
.fx-sz{display:flex;align-items:flex-start;gap:14px}
.fx-sz .l{display:flex;flex-direction:column;gap:6px;flex:none}
.fx-sz .r{flex:1;padding-top:2px;display:flex;flex-direction:column;gap:2px}
.fx-hal{display:flex;align-items:center;gap:10px;height:26px;padding:0 10px;background:linear-gradient(90deg,rgba(255,159,90,.14),rgba(124,140,255,.10));border-left:2px solid #FF9F5A}
.fx-hal b{font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;letter-spacing:.12em;color:#FFD2B0}
.fx-hal .n{margin-left:auto;font-size:12px;color:var(--tx3)}
.fx-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fx-st{display:flex;align-items:center;gap:8px}
.fx-st-b{display:flex;flex-direction:column;gap:4px}
.fx-st-v{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;line-height:1;color:var(--tx)}
.fx-st-v.ap{color:var(--vi)}
.fx-st-l{font-size:11px;line-height:1;color:var(--tx3);white-space:nowrap}
.fx-acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fx-act{position:relative;appearance:none;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:8px 2px 6px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(91,228,255,.06),rgba(91,228,255,.02));font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer;transition:border-color .2s,box-shadow .2s,color .2s}
.fx-act .ico{width:20px;height:20px;color:var(--cy);filter:drop-shadow(0 0 3px rgba(91,228,255,.6))}
.fx-act .fx-key{position:absolute;left:4px;top:4px;min-width:16px;height:16px;font-size:11px;padding:0 3px}
.fx-act span:last-child{white-space:nowrap}
.fx-act.hov,.fx-act:hover{border-color:var(--cy);color:var(--tx);box-shadow:0 0 16px -4px rgba(91,228,255,.9),inset 0 0 12px rgba(91,228,255,.12)}
.fx-act.dng{border-color:rgba(255,77,99,.5);color:var(--rd2);background:linear-gradient(180deg,rgba(255,77,99,.10),rgba(255,77,99,.03))}
.fx-act.dng .ico{color:var(--rd);filter:drop-shadow(0 0 3px rgba(255,77,99,.7))}
.fx-prev{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid rgba(91,228,255,.3);background:rgba(91,228,255,.06);font-size:13px;color:var(--tx2)}
.fx-prev .ico{width:14px;height:14px;color:var(--cy)}
.fx-prev .mono{color:var(--tx);font-weight:600}
.fx-team{display:flex;align-items:center;gap:12px}
.fx-team-m{display:flex;flex-direction:column;gap:4px;flex:1}
.fx-team-m b{font-family:'Chakra Petch',sans-serif;font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--tx)}
.fx-team-m span{font-size:12px;color:var(--tx3)}
.fx-team .fx-bt{height:36px}
.fx-more{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 16px;border-top:1px solid var(--line);font-size:12px;color:var(--tx3)}
.fx-more a{display:inline-flex;align-items:center;gap:4px;font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--cy);text-decoration:none}

/* araştırma */
.fx-rs-top{display:flex;align-items:baseline;justify-content:space-between;font-size:14px;color:var(--tx2)}
.fx-rs-top b{color:var(--tx);font-weight:600}
.fx-rs-cost{font-size:20px;font-weight:600;color:var(--rd)}
.fx-rs-cost small{font-size:12px;margin-left:3px;color:var(--tx3)}
.fx-seg{display:flex;align-items:stretch;height:40px;border:1px solid var(--line)}
.fx-seg-l{display:flex;align-items:center;gap:6px;padding:0 12px;border-right:1px solid var(--line);color:var(--am)}
.fx-seg-l .fx-cap{color:var(--am)}
.fx-seg-o{appearance:none;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-right:1px solid var(--line);background:none;cursor:pointer;color:var(--tx2)}
.fx-seg-o:last-child{border-right:0}
.fx-seg-o b{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;line-height:1}
.fx-seg-o span{font-size:11px;line-height:1;color:var(--tx3)}
.fx-seg-o.on{background:linear-gradient(180deg,rgba(255,181,71,.22),rgba(255,181,71,.08));color:var(--am2);box-shadow:inset 0 -2px 0 var(--am)}
.fx-seg-o.on span{color:var(--am)}
.fx-tree{display:flex;flex-direction:column;gap:2px}
.fx-br{position:relative;height:94px;border-bottom:1px solid rgba(91,228,255,.1);animation:fx-row-in .5s cubic-bezier(.2,.8,.2,1) both}
.fx-br:nth-child(2){animation-delay:.08s}.fx-br:nth-child(3){animation-delay:.16s}.fx-br:nth-child(4){animation-delay:.24s}
.fx-tree-ln{position:absolute;left:0;top:0}
.fx-tree-ln path{fill:none;stroke-width:1.6}
.fx-tree-ln .fl{stroke:#5BE4FF;stroke-dasharray:4 4;animation:fx-flow 1.2s linear infinite;filter:drop-shadow(0 0 3px rgba(91,228,255,.8))}
.fx-tree-ln .av{stroke:rgba(91,228,255,.55);stroke-dasharray:3 4}
.fx-tree-ln .lk{stroke:rgba(110,143,160,.45);stroke-dasharray:2 5}
.fx-br-l{position:absolute;left:0;top:10px;width:132px;display:flex;flex-direction:column;gap:6px}
.fx-br-n{font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;letter-spacing:.14em;line-height:1;color:var(--tx)}
.fx-br-c{font-size:11px;line-height:1;color:var(--tx3)}
.fx-br-g{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.fx-br-g .ico{width:12px;height:12px}
.fx-br-g b{font-size:12px}
.fx-rn{position:absolute;top:0;width:52px;height:94px;appearance:none;padding:0;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.fx-rn .hx{position:relative;width:52px;height:52px;flex:none}
.fx-rn .hx svg{width:52px;height:52px;overflow:visible}
.fx-rn.run .pg{filter:drop-shadow(0 0 4px rgba(91,228,255,.9))}
.fx-rn.sel .hx::after{content:'';position:absolute;inset:-7px;border:1.5px dashed var(--am);border-radius:50%;animation:fx-spin 7s linear infinite;box-shadow:0 0 12px rgba(255,181,71,.35)}
.fx-rn.done .hx svg{filter:drop-shadow(0 0 5px rgba(61,255,180,.5))}
.fx-rn.lock{opacity:.75}
.fx-rn-n{position:absolute;top:54px;left:50%;translate:-50% 0;width:112px;text-align:center;font-size:11px;font-weight:600;line-height:1.15;color:var(--tx)}
.fx-rn.lock .fx-rn-n{color:var(--tx3)}
.fx-rn-m{position:absolute;top:81px;left:50%;translate:-50% 0;display:inline-flex;align-items:center;gap:3px;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1;color:var(--tx3);white-space:nowrap}
.fx-rn-m .ico{width:10px;height:10px}
.fx-rd{display:flex;flex-direction:column;gap:7px;margin-top:auto;padding:10px 14px;border:1px solid rgba(255,181,71,.55);background:linear-gradient(180deg,rgba(255,181,71,.10),rgba(255,181,71,.03));box-shadow:0 0 18px -6px rgba(255,181,71,.6)}
.fx-rd-h{display:flex;align-items:baseline;justify-content:space-between}
.fx-rd-h b{font-size:15px;font-weight:600;color:var(--tx)}
.fx-rd-h .r{font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--am)}
.fx-rd-p{display:flex;align-items:center;gap:10px;font-size:13px}
.fx-rd-p b{color:var(--tx)}
.fx-rd-p b.bl{margin-left:auto;color:var(--cy)}
.fx-pg{position:relative;width:180px;height:6px;background:rgba(91,228,255,.14);overflow:hidden}
.fx-pg i{position:absolute;left:0;top:0;bottom:0;background:var(--cy);box-shadow:0 0 8px var(--cy)}
.fx-pg i::after{content:'';position:absolute;top:0;bottom:0;width:40px;right:0;background:linear-gradient(90deg,transparent,#FFFFFF);opacity:.8;animation:fx-pulse 1.2s ease-in-out infinite}
.fx-rd-f{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx3)}
.fx-rd-f .ico{width:13px;height:13px;color:var(--am)}
.fx-rd-f b{font-size:13px;color:var(--tx)}
.fx-rd-u{display:inline-flex;align-items:center;gap:4px;margin-left:6px;color:var(--tx2)}
.fx-rd-u .ico{color:var(--tx3)}
.fx-rd-f .fx-bt{margin-left:auto;height:28px}

/* ipucu (FON dökümü, düğüm) */
.fx-tip{padding:12px 14px 12px;display:flex;flex-direction:column;gap:10px;border-color:rgba(91,228,255,.45);box-shadow:0 12px 30px rgba(0,0,0,.6),0 0 22px -8px rgba(91,228,255,.8);animation:fx-in-down .35s cubic-bezier(.2,.8,.2,1) both;z-index:5}
.fx-tip-h{display:flex;align-items:baseline;gap:8px}
.fx-tip-h .s{font-size:12px;color:var(--tx3)}
.fx-tip-h .r{margin-left:auto;font-size:18px;font-weight:600;color:var(--rd)}
.fx-tip-h .r small{font-size:11px;color:var(--tx3)}
.fx-bal{display:flex;flex-direction:column;gap:7px}
.fx-bal-r{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2)}
.fx-bal-r span:first-child{width:40px}
.fx-bal-b{position:relative;flex:1;height:8px;background:rgba(91,228,255,.08)}
.fx-bal-b i{position:absolute;top:0;bottom:0;left:0}
.fx-bal-b i.g{background:var(--mt);box-shadow:0 0 6px rgba(61,255,180,.7)}
.fx-bal-b i.r1{background:var(--rd);box-shadow:0 0 6px rgba(255,77,99,.7)}
.fx-bal-b i.r2{background:var(--rd2)}
.fx-bal-r b{width:38px;text-align:right;font-size:13px}
.fx-bal-k{display:flex;gap:12px;font-size:11px;color:var(--tx3)}
.fx-bal-k span{display:inline-flex;align-items:center;gap:4px}
.fx-bal-k i{width:7px;height:7px}
.fx-net{display:flex;align-items:baseline;gap:6px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--tx2)}
.fx-net b{font-size:18px;font-weight:600;color:var(--rd)}
.fx-net .u{color:var(--tx3)}
.fx-net .r{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:var(--am)}
.fx-net .r .ico{width:12px;height:12px}
.fx-spark{display:block;overflow:visible}
.fx-spark .ln{stroke-dasharray:600;stroke-dashoffset:600;animation:fx-draw 1.4s .3s ease-out forwards;filter:drop-shadow(0 0 3px rgba(91,228,255,.8))}
@keyframes fx-draw{to{stroke-dashoffset:0}}
.fx-spark .end{filter:drop-shadow(0 0 5px #FF4D63);animation:fx-pulse 1.2s ease-in-out infinite}
.fx-spark-l{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3)}
.fx-tip::before{left:var(--px);top:-7px;width:12px;height:12px;border:1px solid rgba(91,228,255,.45);border-right:0;border-bottom:0;background:#0C1D30;transform:rotate(45deg);filter:none}

/* haberler */
.fx-flt{display:flex;align-items:center;gap:8px}
.fx-fc{appearance:none;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border:1px solid var(--line);background:none;font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer}
.fx-fc b{font-size:12px;color:var(--tx3)}
.fx-fc.on{border-color:var(--cy);background:rgba(91,228,255,.12);color:var(--tx)}
.fx-fc.on b{color:var(--cy)}
.fx-fc .dt{width:7px;height:7px;border-radius:50%;background:var(--vi);box-shadow:0 0 6px var(--vi)}
.fx-flt .r{margin-left:auto;font-size:12px;color:var(--tx3)}
.fx-day-h{display:flex;align-items:center;gap:10px;margin-top:2px;font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--cy)}

.fx .hp i.o{background:transparent;border:1px solid currentColor;box-shadow:none}
.fx .hp svg{width:12px;height:12px;display:block;flex:none}

.fx .hp.ai{border-color:rgba(255,77,99,.75);color:var(--rd);box-shadow:0 0 10px rgba(255,77,99,.25)}

.fx .flag{position:relative;display:block;width:60px;height:34px}

.fx .flag .fb{position:absolute;left:2px;top:0;display:inline-flex;align-items:center;gap:3px;height:21px;padding:0 6px 0 5px;background:rgba(26,3,8,.92);border:1.5px solid var(--rd);font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;line-height:1;color:#FFC2CA;box-shadow:0 0 10px rgba(255,77,99,.45)}
.fx .flag .fq{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1.5px dashed var(--am);font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:700;color:var(--am)}
.fx .flag .fq svg{display:none}
.fx .flag.q .fb{border-color:var(--am);border-style:dashed;box-shadow:0 0 10px rgba(255,181,71,.35)}
.fx .flag .fs,.fx .seal{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:rgba(61,255,180,.16);border:1px solid var(--mt)}
.fx .flag .fs svg path,.fx .seal svg path{stroke:var(--mt)}
.fx .flag .fs svg,.fx .seal svg{width:9px;height:9px}
.fx .flag.ok .fb{border-color:var(--mt)}
.fx .flag.now .fb{background:var(--rd);color:#1A0306;height:24px;font-size:16px;box-shadow:0 0 16px rgba(255,77,99,.9);animation:fx-pulse 1s ease-in-out infinite}
.fx .flag.done{opacity:.45}
.fx .flag.done .fb b{text-decoration:line-through;text-decoration-thickness:2px}
.fx .flag.cancel .fb{position:relative;border-color:var(--tx3);color:var(--tx3);box-shadow:none}
.fx .flag.cancel .fb::after{content:'';position:absolute;left:-4px;right:-4px;top:50%;height:2px;margin-top:-1px;background:var(--rd);box-shadow:0 0 6px var(--rd);transform:rotate(-28deg)}
.fx .pop{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 7px;background:rgba(26,3,8,.92);border:1.5px solid var(--rd);font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;line-height:1;color:#FF8A97;box-shadow:0 0 14px rgba(255,77,99,.55);animation:fx-bob 1.6s ease-in-out infinite}
.fx .pop.heal{border-color:var(--am);color:var(--am)}
.fx .pop.heal svg{width:13px;height:13px}
.fx .stamp{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border:1.5px solid currentColor;background:rgba(2,8,14,.9);font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;letter-spacing:.16em;line-height:1;color:var(--cy);box-shadow:0 0 12px -2px currentColor;white-space:nowrap}

.fx .stamp.s-red{color:var(--rd)}
.fx .stamp.s-green{color:var(--mt)}
.fx .stamp.s-ink,.fx .stamp.s-blue{color:var(--cy)}

.fx .stamp svg{width:13px;height:13px}

/* sol üst: tur + hedef */
.fx-turn{left:16px;top:14px;height:62px;display:flex;align-items:center;gap:12px;padding:0 12px 0 12px;animation:fx-in-down .7s cubic-bezier(.2,.8,.2,1) both}

.fx-tbs{display:flex;gap:4px}
.fx-tb{width:24px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--tx3);clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.fx-tb.past{background:rgba(91,228,255,.12);color:var(--tx2)}
.fx-tb.now{background:var(--cy);border-color:var(--cy);color:#02050A;box-shadow:0 0 12px rgba(91,228,255,.8)}
.fx-tb.last{border-color:rgba(255,77,99,.7);color:var(--rd2)}
.fx-tb.last.now{background:var(--rd);border-color:var(--rd);color:#1A0306;box-shadow:0 0 12px rgba(255,77,99,.9)}
.fx-ph{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:700;letter-spacing:.16em;white-space:nowrap}
.fx-ph .lp{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:fx-blink 1.2s steps(1) infinite}

.fx-ph.ai{color:var(--rd);border:1px solid rgba(255,77,99,.7);background:rgba(255,77,99,.1)}
.fx-last{transform:rotate(-3deg)}
.fx-obj{left:16px;top:88px;width:394px;padding:8px 12px 9px;animation:fx-in-down .7s .08s cubic-bezier(.2,.8,.2,1) both}
.fx-obj-h{display:flex;align-items:center;gap:8px;height:22px}
.fx-obj-h .s{font-size:12px;color:var(--tx3)}
.fx-obj-hal{display:inline-flex;align-items:center;gap:4px;margin-left:auto;font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;color:#FFD2B0}
.fx-aich{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border:1px solid rgba(255,77,99,.6);background:rgba(255,77,99,.08);font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--rd2)}
.fx-aich svg{width:12px;height:12px}
.fx-obj-h .fx-aich:first-child,.fx-obj-h .s + .fx-aich{margin-left:auto}
.fx-obj-r{display:flex;align-items:center;gap:8px;margin-top:4px}
.fx-tg{display:flex;align-items:center;gap:6px}
.fx-th{display:block;flex:none;overflow:visible;filter:drop-shadow(0 0 1.5px rgba(91,228,255,.6))}
.fx-tg-b{display:flex;flex-direction:column;gap:5px}
.fx-tg-n{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--tx)}
.fx-tg-n svg{width:12px;height:12px}
.fx-tg.broken .fx-th{opacity:.6}
.fx-plus{font-family:'Chakra Petch',sans-serif;font-size:16px;color:var(--tx3)}
.fx-vr2{width:1px;height:40px;margin:0 2px 0 auto;background:var(--line)}
.fx-civ{display:flex;flex-direction:column;gap:6px}
.fx-civ-i{display:flex;gap:4px}
.fx-civ-i svg{width:16px;height:16px}

/* sağ üst düğmeler */
.fx-tbtns{position:absolute;right:16px;top:14px;display:flex;gap:8px;animation:fx-in-down .7s .12s cubic-bezier(.2,.8,.2,1) both}
.fx-pb{position:relative;appearance:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 11px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(14,32,52,.86),rgba(5,14,26,.92));font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;line-height:1;color:var(--tx2);cursor:pointer;backdrop-filter:blur(8px)}
.fx-pb .ico{width:15px;height:15px;color:var(--cy)}
.fx-pb:hover{border-color:var(--cy2);color:var(--tx)}

.fx-pb.red{border-color:rgba(255,77,99,.6);color:var(--rd2);background:linear-gradient(180deg,rgba(60,8,16,.9),rgba(26,3,8,.94))}
.fx-pb.red .ico{color:var(--rd)}
.fx-pb.red.armed{z-index:3;background:var(--rd);border-color:var(--rd);color:#1A0306;box-shadow:0 0 22px rgba(255,77,99,.9);animation:fx-pulse 1s ease-in-out infinite}
.fx-pb.red.armed .ico{color:#1A0306}
.fx-pb .bdg.dot{position:absolute;top:-5px;right:-5px;width:11px;height:11px;border-radius:50%;background:var(--rd);box-shadow:0 0 8px var(--rd);animation:fx-pulse 1.2s ease-in-out infinite}

/* sol alt: ekip */
.fx-team-row{position:absolute;left:16px;bottom:16px;display:flex;align-items:flex-end;gap:8px}
.fx-uc{position:relative;appearance:none;display:flex;align-items:center;gap:8px;width:204px;height:74px;padding:0 10px 0 8px;text-align:left;border:1px solid rgba(61,255,180,.3);background:linear-gradient(180deg,rgba(8,30,30,.86),rgba(3,14,16,.92));color:var(--tx);cursor:pointer;backdrop-filter:blur(8px);animation:fx-in-up .6s cubic-bezier(.2,.8,.2,1) both;transition:border-color .2s,box-shadow .2s}
.fx-uc::before{content:'';position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:var(--mt);opacity:.6;box-shadow:0 0 6px var(--mt)}
.fx-uc:hover{border-color:rgba(61,255,180,.7)}
.fx-uc .fx-key{position:absolute;left:5px;top:5px;min-width:16px;height:16px;font-size:11px;padding:0 3px}
.fx-uc-t{position:relative;width:40px;height:56px;flex:none;margin-left:12px}
.fx-uc-b{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.fx-uc-n{font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;line-height:1;white-space:nowrap}
.fx-uc-s{display:flex;flex-direction:column;gap:5px}
.fx-av2{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);color:var(--tx3);clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.fx-av2 .ico{width:14px;height:14px}
.fx-av2.on{border-color:rgba(91,228,255,.6);color:var(--cy);background:rgba(91,228,255,.1)}
.fx-av2.arm{border-color:var(--am);color:#1A1000;background:var(--am);box-shadow:0 0 10px rgba(255,181,71,.8)}
.fx-av2.off{opacity:.45}
.fx-av2.pulse{animation:fx-ringp 1.2s ease-in-out infinite;border-color:var(--am);color:var(--am);background:rgba(255,181,71,.12)}
.fx-uc.sel{height:82px;border-color:var(--am);box-shadow:0 0 22px -4px rgba(255,181,71,.8)}
.fx-uc.sel::before{background:var(--am);box-shadow:0 0 8px var(--am);opacity:1}
.fx-uc.sel .fx-uc-n{color:var(--am2)}
.fx-uc.done{opacity:.6}
.fx-uc.warn{border-color:var(--am);box-shadow:0 0 0 1px rgba(255,181,71,.5),0 0 22px -4px rgba(255,181,71,.9)}
.fx-uc.down{border-color:rgba(255,77,99,.45);background:linear-gradient(180deg,rgba(40,6,12,.86),rgba(16,3,6,.92))}
.fx-uc.down::before{background:var(--rd);box-shadow:0 0 6px var(--rd)}
.fx-uc.down .fx-uc-n{color:var(--tx3);text-decoration:line-through;text-decoration-color:rgba(255,77,99,.8)}
.fx-uc.down .fx-uc-t{opacity:.45}
.fx-uc .xo{position:absolute;inset:6px 2px;background:linear-gradient(45deg,transparent 46%,var(--rd) 47%,var(--rd) 53%,transparent 54%),linear-gradient(-45deg,transparent 46%,var(--rd) 47%,var(--rd) 53%,transparent 54%);filter:drop-shadow(0 0 3px var(--rd))}
.fx-dn{position:absolute;right:8px;top:40px;transform:rotate(-6deg)}
.fx-team-row.locked .fx-uc{opacity:.5;filter:saturate(.4)}
.fx-pp.dn i{background:none;border:1px solid rgba(255,77,99,.5);box-shadow:none}

/* sağ alt: geri al, turu bitir */
.fx-end{position:absolute;right:16px;bottom:18px;display:flex;align-items:center;gap:10px;animation:fx-in-up .7s .15s cubic-bezier(.2,.8,.2,1) both}
.fx-bt.lg{height:48px;padding:0 16px;font-size:14px}
.fx-endb{height:58px !important;padding:0 24px !important;font-size:17px !important;letter-spacing:.14em !important}

.fx-bt.off .ico{color:var(--tx3)}
.fx-bt.confirm{background:var(--am);border-color:var(--am);color:#1A1000;box-shadow:0 0 22px rgba(255,181,71,.85);animation:fx-pulse 1.1s ease-in-out infinite}
.fx-bt.confirm .fx-key{color:#1A1000;border-color:rgba(26,16,0,.4)}

/* birim kartı, üstüne gelme kartı */
.fx-ucard{width:360px;padding:0 0 12px;border-color:rgba(255,181,71,.55);animation:fx-in-up .45s cubic-bezier(.2,.8,.2,1) both}

.fx-ucard-n{display:flex;flex-direction:column;gap:7px}

.fx-ucard-hp{display:inline-flex;align-items:center;gap:6px;color:var(--mt)}
.fx-ucard-hp .ico{width:14px;height:14px}
.fx-ab{display:flex;align-items:center;gap:9px;height:42px;margin:10px 12px 0;padding:0 12px;border:1px solid var(--line);font-size:14px;color:var(--tx2)}

.fx-ab .n{font-weight:600;color:var(--tx)}

.fx-ab.arm .n{color:var(--am2)}
.fx-ab-fx{display:flex;gap:6px;margin:8px 12px 0}
.fx-fx{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border:1px solid rgba(255,77,99,.45);background:rgba(255,77,99,.08);font-size:12px;color:var(--tx2)}

.fx-fx .ico{width:12px;height:12px;color:var(--rd2)}

.fx-hcard::before,.fx-hcard::after{border-color:var(--rd);filter:drop-shadow(0 0 3px rgba(255,77,99,.8))}
.fx-hcard-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.fx-hcard-h b{flex:1;font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--tx)}
.fx-hl{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;font-size:13px;color:var(--tx2)}

.fx-hl .neg{color:var(--rd)}

.fx-hl .pos svg{width:15px;height:15px}
.fx-hl.ok{color:var(--mt)}
.fx-hl.ok .ico{color:var(--mt)}
.fx-hl-win{display:flex;align-items:center;gap:8px;margin:6px 10px 2px;padding:8px 10px;border:1px solid rgba(61,255,180,.5);background:rgba(61,255,180,.08)}
.fx-hl-win .t{font-size:12px;color:var(--mt)}
.fx-stamp.grn{color:var(--mt);background:rgba(61,255,180,.1);box-shadow:0 0 14px rgba(61,255,180,.35)}

/* makineler: olay şeridi */
.fx-evs{padding:9px 12px 10px;border-color:rgba(255,77,99,.45);border-left:3px solid var(--rd);animation:fx-in-left .45s cubic-bezier(.2,.8,.2,1) both}
.fx-evs::before,.fx-evs::after{border-color:var(--rd)}
.fx-evs-q{display:flex;align-items:center;gap:5px}
.fx-evs-q .fx-cap{margin-right:4px;color:var(--rd2)}
.fx-evs-q .r{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx3)}
.fx-q{position:relative;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--tx3)}
.fx-q.done{background:rgba(255,77,99,.12);color:var(--tx3);text-decoration:line-through}
.fx-q.now{background:var(--rd);border-color:var(--rd);color:#1A0306;box-shadow:0 0 12px rgba(255,77,99,.9);animation:fx-pulse 1s ease-in-out infinite}

.fx-rk{width:22px;height:22px;flex:none}
.fx-evs-l .n{font-weight:600;color:var(--rd)}
.fx-evs-l .t{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.fx-evs-l .t .ico{width:13px;height:13px;color:var(--rd2)}
.fx-evs-l .neg{color:var(--rd);font-weight:600}

/* turu bitir onayı */
.fx-endq{right:16px;bottom:100px;width:336px;padding:12px 14px;border-color:rgba(255,181,71,.6);animation:fx-in-up .4s cubic-bezier(.2,.8,.2,1) both}
.fx-endq::before,.fx-endq::after{border-color:var(--am)}
.fx-endq-h{display:flex;align-items:center;gap:8px;font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;letter-spacing:.16em;color:var(--am)}
.fx-endq-h .ico{width:16px;height:16px}
.fx-endq-r{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}

.fx-endq-r .s{font-size:12px;color:var(--tx3)}
.fx-endq-r .fx-av2.on{border-color:var(--am);color:var(--am);background:rgba(255,181,71,.1)}
.fx-endq-w{display:flex;align-items:center;gap:8px;margin-top:9px;padding:7px 9px;border:1px solid rgba(255,77,99,.45);background:rgba(255,77,99,.08);font-size:13px;color:var(--tx2)}

/* günlük */
.fx-log{display:flex;flex-direction:column;animation:fx-in-right .45s cubic-bezier(.2,.8,.2,1) both}
.fx-log-h{display:flex;align-items:center;gap:8px;height:44px;padding:0 8px 0 14px;border-bottom:1px solid var(--line);font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;letter-spacing:.16em}
.fx-log-h .r{margin-left:auto;font-size:11px;letter-spacing:0;color:var(--tx3)}
.fx-lamp.g{background:var(--mt);box-shadow:0 0 8px var(--mt)}
.fx-log-b{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;padding:12px 14px;mask-image:linear-gradient(180deg,transparent 0,#000 46px)}
.fx-log-b .ln{flex-shrink:0;display:flex;align-items:flex-start;gap:7px;font-size:13px;line-height:1.35;color:var(--tx2);animation:fx-row-in .4s ease-out both}

.fx-log-b .ln.good .ico{color:var(--mt)}

        var u2 = norm(cross(ax, [0.1, 1, 0.3])), w2 = cross(ax, u2), apts = [];
        for (var as = 0; as <= 16; as++) {
          var aa2 = a0 + (as / 16) * span, rr4 = 1.08 + o.rnd() * 0.12 + 0.12 * Math.sin(as);
          apts.push([(u2[0] * Math.cos(aa2) + w2[0] * Math.sin(aa2)) * rr4, (u2[1] * Math.cos(aa2) + w2[1] * Math.sin(aa2)) * rr4, (u2[2] * Math.cos(aa2) + w2[2] * Math.sin(aa2)) * rr4]);
        }
        o.arcs.push(apts);
      }
      o.nextFil = t + 0.07 + o.rnd() * (0.22 - 0.1 * wB);
    }
    function polyline(list, colW, colT, aW, aT, lw) {
      list.forEach(function (pts) {
        var sc = pts.map(function (p2) { var q5 = rot(p2[0], p2[1], p2[2]); return [cx + q5[0] * Rg, cy - q5[1] * Rg]; });
        g.lineJoin = 'round';
        g.strokeStyle = rgba(colW, aW); g.lineWidth = lw * 3.2;
        g.beginPath(); sc.forEach(function (pt, k5) { if (k5) g.lineTo(pt[0], pt[1]); else g.moveTo(pt[0], pt[1]); }); g.stroke();
        g.strokeStyle = rgba(colT, aT); g.lineWidth = lw;
        g.beginPath(); sc.forEach(function (pt, k5) { if (k5) g.lineTo(pt[0], pt[1]); else g.moveTo(pt[0], pt[1]); }); g.stroke();
      });
    }
    if (o.fil.length) polyline(o.fil, C.blue, C.white, 0.16 * dim * grow, 0.85 * dim * grow, 1.1);
    if (o.arcs.length) polyline(o.arcs, C.blue, C.ice, 0.2 * dim * grow, 0.7 * dim * grow, 1.3);

    // kıvılcımlar
    if (!unk) {
      var rate = (1.2 * wA + 16 * wB + 20 * wC) * (quar ? 0.4 : 1) * (R / 34);
      o.spAcc = (o.spAcc || 0) + rate * dt;
      while (o.spAcc > 1) {
        o.spAcc -= 1;
        var dv = norm([o.rnd() * 2 - 1, o.rnd() * 2 - 1, o.rnd() * 2 - 1]);
        var spd = 0.6 + o.rnd() * (0.6 + wB);
        o.sparks.push({ p: [dv[0], dv[1], dv[2]], v: [dv[0] * spd, dv[1] * spd, dv[2] * spd], life: 0, max: 0.5 + o.rnd() * 0.7, col: o.rnd() < blueF ? (o.rnd() < 0.5 ? C.ice : C.blue) : (o.rnd() < 0.5 ? C.goldHi : C.amber) });
      }
      for (var sk = o.sparks.length - 1; sk >= 0; sk--) {
        var spk = o.sparks[sk];
        spk.life += dt;
        if (spk.life > spk.max) { o.sparks.splice(sk, 1); continue; }
        spk.p[0] += spk.v[0] * dt; spk.p[1] += spk.v[1] * dt; spk.p[2] += spk.v[2] * dt;
        var q6 = rot(spk.p[0], spk.p[1], spk.p[2]), lf = 1 - spk.life / spk.max, szs = R * 0.07 * (0.5 + lf);
        g.globalAlpha = lf * 0.9 * dim;
        g.drawImage(sprite(spk.col), cx + q6[0] * Rg - szs, cy - q6[1] * Rg - szs, szs * 2, szs * 2);
      }
      g.globalAlpha = 1;
    }

    // bilinmeyen: parazit çizgileri
    if (unk) {
      for (var gl = 0; gl < 3; gl++) {
        var yy = cy + Math.sin(t * (1.3 + gl) + gl * 2) * R * 0.9, ww = R * (0.6 + 0.6 * Math.abs(Math.sin(t * 3 + gl)));
        g.fillStyle = rgba([150, 180, 190], 0.08 + 0.08 * Math.abs(Math.sin(t * 11 + gl)));
        g.fillRect(cx - ww, yy, ww * 2, 1.4);
      }
    }
    g.globalCompositeOperation = 'source-over';
    o.lastLevel = o.lv;
  }

  var orbs = [];
  function scan() {
    var cvs = (root.querySelectorAll ? root : document).querySelectorAll('canvas[data-orb]');
    var live = [];
    for (var i = 0; i < cvs.length; i++) {
      var cv = cvs[i], o = null;
      for (var j = 0; j < orbs.length; j++) if (orbs[j].cv === cv) { o = orbs[j]; break; }
      if (!o) { try { o = build(cv); } catch (e) { continue; } }
      live.push(o);
    }
    orbs = live;
  }
  scan();
  if (opt.manual) {
    // belirlenimci adım: altın kareler ve karşılaştırma için (rAF yok). api.advance(dt, n) → t
    var tm = 0;
    var api = function () {};
    api.advance = function (dt, n) {
      for (var i = 0; i < (n || 1); i++) {
        tm += dt;
        for (var k = 0; k < orbs.length; k++) draw(orbs[k], tm, dt);
      }
      return tm;
    };
    api.rescan = scan;
    return api;
  }
  var raf = 0, last = 0, stopped = false, lastScan = 0, T0 = performance.now();
  // görünmüyorsa çizme (sayfa gizli ya da kare ekran dışında); çizim pahalılaşırsa kare hızını düşür
  var vis = true, io = null, drawn = 0, cost = 0, baseFPS = FPS;
  try {
    var tgt = root && root.nodeType === 1 ? root : document.body;
    if (window.IntersectionObserver && tgt) {
      io = new IntersectionObserver(function (es) { vis = es[es.length - 1].isIntersecting; });
      io.observe(tgt);
    }
  } catch (e) { io = null; }
  function frame(now) {
    if (stopped) return;
    raf = requestAnimationFrame(frame);
    if (now - last < 1000 / FPS) return;
    if (drawn > 3 && (document.hidden || !vis)) { last = now; return; }
    var dt = last ? Math.min(0.1, (now - last) / 1000) : 1 / FPS;
    last = now;
    var t = Math.max(0, (now - T0) / 1000);
    if (now - lastScan > 1000) { lastScan = now; scan(); }
    var c0 = performance.now();
    for (var k = 0; k < orbs.length; k++) {
      if (!orbs[k].cv.isConnected) continue;
      draw(orbs[k], t, dt);
    }
    drawn++;
    cost = cost * 0.9 + (performance.now() - c0) * 0.1;
    if (cost > 14 && FPS > 16) FPS = Math.max(16, FPS - 2);
    else if (cost < 6 && FPS < baseFPS) FPS = Math.min(baseFPS, FPS + 1);
  }
  raf = requestAnimationFrame(frame);
  return function () { stopped = true; cancelAnimationFrame(raf); if (io) io.disconnect(); };
}

window.__fxStop = fxOrbs(document);
</script>
