function proj(v) { const p = v.clone().project(cam); return [+((p.x + 1) / 2 * W).toFixed(2), +((1 - p.y) / 2 * H).toFixed(2)]; }

  const [[x0, y0], [x1, y1], [x2, y2], [x3, y3]] = qd;
  const sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
